name: Goal-Driven AI PR Reviewer
description: Conversation-aware pull request reviews with isolated AI sessions, MCP-enabled tools, and stale-review lifecycle management.
author: MarkHuang.ai
inputs:
  executor:
    description: "Review backend: claude or codex."
    required: false
    default: claude
  codex-websockets:
    description: Permit native Codex WebSockets with HTTP fallback; requires executor codex.
    required: false
    default: "false"
  codex-model-catalog-url:
    description: Optional Codex-compatible proxy model catalog URL; requires executor codex.
    required: false
  github-pat:
    description: >-
      A GitHub PAT scoped to the target repository. Summary-only runs need Contents
      and Pull requests read access; interactive runs need both set to Read and
      write because lifecycle reconciliation resolves review threads.
    required: true
  ai-base-url:
    description: Anthropic Messages API base URL for Claude, or Responses API proxy base URL for Codex (usually ending in /v1).
    required: true
  ai-secret:
    description: API key for the configured AI endpoint.
    required: true
  model:
    description: Model identifier accepted by the configured AI endpoint.
    required: true
  effort:
    description: "Optional model reasoning effort: low, medium, high, xhigh, or max; requires support from the selected model and proxy."
    required: false
  system-prompt:
    description: Optional full replacement for the built-in review system prompt; the effective prompt is written to the redacted action log.
    required: false
  model-pricing:
    description: Optional strict JSON model pricing configuration with rates per one million tokens.
    required: false
  review-prompts:
    description: A non-empty JSON array of review goal objects with a non-empty prompt and optional exact context file paths.
    required: true
  parallel-count:
    description: Maximum number of isolated goal sessions running concurrently.
    required: false
    default: "5"
  max-turns:
    description: Maximum turns per goal session (2-500). Claude counts SDK model/tool turns; Codex counts app-server turns, including native goal continuations and repairs, each of which may contain multiple model calls.
    required: false
    default: "50"
  auto-approve:
    description: Approve only a complete review with no Critical, High, or Medium findings.
    required: false
    default: "false"
  interact-with-pr:
    description: Post the review to the pull request; when false, still read its conversation but write the result only to the run summary.
    required: false
    default: "true"
  pull-request-url:
    description: Optional same-host GitHub pull request URL to review instead of inferring the target from the event.
    required: false
  mcp-servers:
    description: Strict YAML mapping of optional HTTP MCP servers.
    required: false
runs:
  using: node24
  main: dist/bootstrap.js
branding:
  color: purple
  icon: eye
