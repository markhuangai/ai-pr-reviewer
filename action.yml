name: Goal-Driven AI PR Reviewer
description: Conversation-aware pull request reviews with isolated AI sessions, MCP-enabled tools, and stale-review lifecycle management.
author: MarkHuang.ai
inputs:
  github-pat:
    description: A GitHub PAT that can read the target repository and, for interactive runs, create and reconcile pull request reviews and threads.
    required: true
  ai-base-url:
    description: Anthropic Messages API-compatible base URL.
    required: true
  ai-secret:
    description: API key for the configured AI endpoint.
    required: true
  model:
    description: Model identifier accepted by the configured AI endpoint.
    required: true
  effort:
    description: "Optional Claude reasoning effort level: low, medium, high, xhigh, or max."
    required: false
  system-prompt:
    description: Optional full replacement for the built-in review system prompt; the effective prompt is written to the redacted action log.
    required: false
  model-pricing:
    description: Optional strict JSON model pricing configuration with rates per one million tokens.
    required: false
  review-prompts:
    description: A non-empty JSON array of review goal objects with a non-empty prompt and optional exact context file paths.
    required: true
  parallel-count:
    description: Maximum number of isolated goal sessions running concurrently.
    required: false
    default: "5"
  max-turns:
    description: Maximum Claude Agent SDK turns per goal session, including /goal, conversation and diff reading, and output repair.
    required: false
    default: "50"
  auto-approve:
    description: Approve only a complete review with no Critical, High, or Medium findings.
    required: false
    default: "false"
  interact-with-pr:
    description: Post the review to the pull request; when false, still read its conversation but write the result only to the run summary.
    required: false
    default: "true"
  pull-request-url:
    description: Optional same-host GitHub pull request URL to review instead of inferring the target from the event.
    required: false
  mcp-servers:
    description: Strict YAML mapping of optional HTTP MCP servers.
    required: false
runs:
  using: node24
  main: dist/bootstrap.js
branding:
  color: purple
  icon: eye
