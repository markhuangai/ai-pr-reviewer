name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }} quality and security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 25]
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Enforce action pin age quarantine
        run: node scripts/check-action-age.mjs
      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Enforce dependency age quarantine before install
        run: node scripts/check-package-age.mjs
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify npm signatures
        run: npm audit signatures
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run OSV scan
        run: npm run security:osv
      - name: Scan tracked files for secrets
        run: node scripts/secret-scan.mjs
      - name: Check formatting, lint, types, and unit tests
        run: npm run check
      - name: Build compiled runtime and bootstrap
        run: npm run build && npm run bundle:bootstrap
      - name: Verify reproducible compiled runtime
        run: npm run security:repro
      - name: Ensure generated bootstrap is present and stable
        run: git diff --exit-code -- dist/bootstrap.js
      - name: Generate SBOM
        run: npm run security:sbom

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4.6.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Enforce action pin age quarantine
        run: node scripts/check-action-age.mjs
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.28.17
        with:
          languages: javascript-typescript
      - name: Set up Node 24
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Enforce dependency age quarantine before install
        run: node scripts/check-package-age.mjs
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build for CodeQL
        run: npm run build
      - name: Analyze
        uses: github/codeql-action/analyze@v3.28.17
