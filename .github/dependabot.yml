version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    open-pull-requests-limit: 1
    patterns:
      - "*"
    multi-ecosystem-group: dependencies

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    open-pull-requests-limit: 1
    patterns:
      - "*"
    multi-ecosystem-group: dependencies
