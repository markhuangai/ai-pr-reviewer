version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    target-branch: main

updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 1
    # CI quarantines every locked npm package for seven days after publication.
    cooldown:
      default-days: 7
    patterns:
      - "*"
    multi-ecosystem-group: dependencies

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 1
    patterns:
      - "*"
    multi-ecosystem-group: dependencies
